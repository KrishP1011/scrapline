<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCRAPLINE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0C0E13;
    color: #E6E9EF;
    font-family: 'Courier New', ui-monospace, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
    overflow: hidden;
  }
  #wrap { position: relative; width: 900px; max-width: 100%; }
  canvas {
    display: block;
    width: 100%;
    background: #12151C;
    border: 1px solid #262C38;
    border-radius: 10px;
    image-rendering: pixelated;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(8, 10, 14, 0.9);
    border-radius: 10px;
    padding: 24px;
  }
  .overlay.on { display: flex; }
  .eyebrow { color: #6B7385; font-size: 11px; letter-spacing: 3px; margin-bottom: 6px; }
  h1 { font-size: 30px; letter-spacing: 2px; margin-bottom: 4px; }
  h2 { font-size: 22px; letter-spacing: 1px; margin-bottom: 18px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 780px; }
  .card {
    width: 176px;
    background: #171B24;
    border: 1px solid #2C3342;
    border-radius: 8px;
    padding: 14px 12px;
    cursor: pointer;
    text-align: left;
    transition: border-color .12s, transform .12s;
  }
  .card:hover:not(.bought):not(.broke) { border-color: #F5A623; transform: translateY(-2px); }
  .card.bought { opacity: .35; cursor: default; border-style: dashed; }
  .card.broke { opacity: .45; cursor: not-allowed; }
  .card .n { font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #E6E9EF; }
  .card .d { font-size: 11px; color: #8A93A5; line-height: 1.45; min-height: 32px; }
  .card .c { font-size: 12px; color: #F5A623; margin-top: 10px; font-weight: 700; }
  .row { display: flex; gap: 10px; margin-top: 20px; align-items: center; }
  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 11px 22px;
    border-radius: 6px;
    border: 1px solid #2C3342;
    background: #171B24;
    color: #E6E9EF;
    cursor: pointer;
  }
  button:hover { border-color: #F5A623; }
  button.go { background: #F5A623; color: #12151C; border-color: #F5A623; }
  .bank { color: #F5A623; font-size: 14px; font-weight: 700; margin-bottom: 16px; }
  .stats { color: #8A93A5; font-size: 12px; line-height: 1.9; margin-bottom: 20px; text-align: center; }
  .hint { color: #565D6B; font-size: 11px; margin-top: 14px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="600"></canvas>

  <div class="overlay" id="shop">
    <div class="eyebrow">WAVE CLEARED</div>
    <h2 id="shopTitle">Salvage Bench</h2>
    <div class="bank" id="bank">0 scrap</div>
    <div class="cards" id="cards"></div>
    <div class="row">
      <button id="reroll">REROLL (<span id="rrCost">4</span>)</button>
      <button class="go" id="next">NEXT WAVE</button>
    </div>
  </div>

  <div class="overlay" id="dead">
    <div class="eyebrow">RUN ENDED</div>
    <h1>SCRAPPED</h1>
    <div class="stats" id="deadStats"></div>
    <button class="go" id="restart">RUN IT BACK</button>
  </div>

  <div class="overlay on" id="title">
    <div class="eyebrow">ARENA SURVIVOR</div>
    <h1>SCRAPLINE</h1>
    <div class="stats">
      WASD or arrows to move<br>
      Your gun fires on its own — stay alive<br>
      Collect scrap, upgrade between waves
    </div>
    <button class="go" id="start">START RUN</button>
    <div class="hint">20 seconds per wave. It gets worse.</div>
  </div>
</div>

<script>
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = 900, H = 600;

const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let p, enemies, bullets, drops, parts, wave, waveTime, spawnT, scrap, kills, state, shake, rrCost, offer;

function reset() {
  p = {
    x: W / 2, y: H / 2, r: 13,
    hp: 60, maxHp: 60,
    speed: 200, dmg: 8, rate: 2.0, range: 270,
    pierce: 0, pickup: 70, bulletSpd: 560,
    cd: 0, inv: 0, lvl: {}
  };
  enemies = []; bullets = []; drops = []; parts = [];
  wave = 1; waveTime = 20; spawnT = 0;
  scrap = 0; kills = 0; shake = 0; rrCost = 4;
  state = 'play';
}

// ---------- enemies ----------
function enemyKinds() {
  const k = [
    { t: 'grunt',  hp: 12 + wave * 5,  spd: 58,  dmg: 5,  r: 11, val: 1, col: '#C4574A', w: 10 },
    { t: 'runner', hp: 8  + wave * 3,  spd: 112, dmg: 4,  r: 8,  val: 1, col: '#D98C3A', w: wave >= 2 ? 7 : 0 },
    { t: 'brute',  hp: 45 + wave * 16, spd: 40,  dmg: 13, r: 20, val: 3, col: '#8E4FB0', w: wave >= 4 ? 4 : 0 }
  ];
  return k.filter(x => x.w > 0);
}

function spawn() {
  const kinds = enemyKinds();
  const total = kinds.reduce((s, k) => s + k.w, 0);
  let r = Math.random() * total, pick = kinds[0];
  for (const k of kinds) { if (r < k.w) { pick = k; break; } r -= k.w; }

  const side = Math.floor(Math.random() * 4);
  let x, y, m = 40;
  if (side === 0) { x = Math.random() * W; y = -m; }
  else if (side === 1) { x = W + m; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + m; }
  else { x = -m; y = Math.random() * H; }

  enemies.push({ ...pick, x, y, maxHp: pick.hp, kx: 0, ky: 0, flash: 0 });
}

function spawnRate() { return Math.max(0.22, 1.15 - wave * 0.075); }

// ---------- fx ----------
function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 170;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .45, max: .45, col, sz: 2 + Math.random() * 3 });
  }
}

// ---------- update ----------
function update(dt) {
  // move
  let dx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  let dy = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  const len = Math.hypot(dx, dy);
  if (len) { dx /= len; dy /= len; }
  p.x = Math.max(p.r, Math.min(W - p.r, p.x + dx * p.speed * dt));
  p.y = Math.max(p.r, Math.min(H - p.r, p.y + dy * p.speed * dt));
  p.inv = Math.max(0, p.inv - dt);

  // auto fire at nearest in range
  p.cd -= dt;
  if (p.cd <= 0) {
    let best = null, bd = p.range;
    for (const e of enemies) {
      const d = Math.hypot(e.x - p.x, e.y - p.y);
      if (d < bd) { bd = d; best = e; }
    }
    if (best) {
      const a = Math.atan2(best.y - p.y, best.x - p.x);
      bullets.push({ x: p.x, y: p.y, vx: Math.cos(a) * p.bulletSpd, vy: Math.sin(a) * p.bulletSpd, dmg: p.dmg, hit: [], pierce: p.pierce });
      p.cd = 1 / p.rate;
    }
  }

  // bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) { bullets.splice(i, 1); continue; }
    for (const e of enemies) {
      if (b.hit.includes(e)) continue;
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + 3) {
        e.hp -= b.dmg; e.flash = .1;
        b.hit.push(e);
        burst(b.x, b.y, e.col, 3);
        const a = Math.atan2(b.vy, b.vx);
        e.kx += Math.cos(a) * 90; e.ky += Math.sin(a) * 90;
        if (b.hit.length > b.pierce) { bullets.splice(i, 1); break; }
      }
    }
  }

  // enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.flash = Math.max(0, e.flash - dt);
    const a = Math.atan2(p.y - e.y, p.x - e.x);
    e.x += (Math.cos(a) * e.spd + e.kx) * dt;
    e.y += (Math.sin(a) * e.spd + e.ky) * dt;
    e.kx *= .88; e.ky *= .88;

    if (e.hp <= 0) {
      burst(e.x, e.y, e.col, 12);
      for (let j = 0; j < e.val; j++)
        drops.push({ x: e.x + (Math.random() - .5) * 16, y: e.y + (Math.random() - .5) * 16, vx: 0, vy: 0 });
      enemies.splice(i, 1); kills++; shake = Math.max(shake, 3);
      continue;
    }
    if (p.inv <= 0 && Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r) {
      p.hp -= e.dmg; p.inv = .65; shake = 12;
      burst(p.x, p.y, '#F5A623', 10);
      e.kx = Math.cos(a) * -260; e.ky = Math.sin(a) * -260;
      if (p.hp <= 0) { die(); return; }
    }
  }

  // drops
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    const dist = Math.hypot(p.x - d.x, p.y - d.y);
    if (dist < p.pickup) {
      const a = Math.atan2(p.y - d.y, p.x - d.x);
      const pull = 300 * (1 - dist / p.pickup) + 90;
      d.x += Math.cos(a) * pull * dt; d.y += Math.sin(a) * pull * dt;
    }
    if (dist < p.r + 6) { scrap++; drops.splice(i, 1); }
  }

  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= .92; q.vy *= .92;
    q.life -= dt;
    if (q.life <= 0) parts.splice(i, 1);
  }

  // wave clock
  spawnT -= dt;
  if (spawnT <= 0) { spawn(); spawnT = spawnRate(); }
  waveTime -= dt;
  if (waveTime <= 0) endWave();

  shake = Math.max(0, shake - dt * 40);
}

// ---------- draw ----------
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  // floor grid
  ctx.strokeStyle = '#181D26'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 45) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 45) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // range ring
  ctx.strokeStyle = 'rgba(245,166,35,0.07)';
  ctx.beginPath(); ctx.arc(p.x, p.y, p.range, 0, 7); ctx.stroke();

  // drops
  ctx.fillStyle = '#F5A623';
  for (const d of drops) ctx.fillRect(d.x - 3, d.y - 3, 6, 6);

  // particles
  for (const q of parts) {
    ctx.globalAlpha = q.life / q.max;
    ctx.fillStyle = q.col;
    ctx.fillRect(q.x - q.sz / 2, q.y - q.sz / 2, q.sz, q.sz);
  }
  ctx.globalAlpha = 1;

  // enemies
  for (const e of enemies) {
    ctx.fillStyle = e.flash > 0 ? '#FFFFFF' : e.col;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#0C0E13';
    ctx.fillRect(e.x - e.r * .35, e.y - e.r * .2, 3, 3);
    ctx.fillRect(e.x + e.r * .15, e.y - e.r * .2, 3, 3);
    if (e.hp < e.maxHp) {
      ctx.fillStyle = '#2C3342'; ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2, 3);
      ctx.fillStyle = '#6BCB6B'; ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2 * (e.hp / e.maxHp), 3);
    }
  }

  // bullets
  ctx.fillStyle = '#FFE9B0';
  for (const b of bullets) ctx.fillRect(b.x - 2.5, b.y - 2.5, 5, 5);

  // player
  ctx.globalAlpha = p.inv > 0 && Math.floor(p.inv * 20) % 2 ? .35 : 1;
  ctx.fillStyle = '#F5A623';
  ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * 1.12, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#12151C';
  ctx.fillRect(p.x - 6, p.y - 3, 3, 4);
  ctx.fillRect(p.x + 3, p.y - 3, 3, 4);
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHUD();
}

function drawHUD() {
  // hp bar
  ctx.fillStyle = '#2C3342'; ctx.fillRect(16, 16, 200, 14);
  ctx.fillStyle = p.hp / p.maxHp > .3 ? '#6BCB6B' : '#C4574A';
  ctx.fillRect(16, 16, 200 * Math.max(0, p.hp / p.maxHp), 14);
  ctx.strokeStyle = '#3A4252'; ctx.lineWidth = 1; ctx.strokeRect(16.5, 16.5, 199, 13);
  ctx.fillStyle = '#E6E9EF'; ctx.font = 'bold 11px Courier New';
  ctx.fillText(Math.max(0, Math.ceil(p.hp)) + ' / ' + p.maxHp, 224, 27);

  ctx.fillStyle = '#F5A623'; ctx.font = 'bold 14px Courier New';
  ctx.fillText('SCRAP ' + scrap, 16, 52);
  ctx.fillStyle = '#8A93A5'; ctx.font = '12px Courier New';
  ctx.fillText('KILLS ' + kills, 110, 52);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#E6E9EF'; ctx.font = 'bold 20px Courier New';
  ctx.fillText('WAVE ' + wave, W / 2, 32);
  ctx.fillStyle = waveTime < 5 ? '#F5A623' : '#8A93A5'; ctx.font = 'bold 15px Courier New';
  ctx.fillText(Math.ceil(waveTime) + 's', W / 2, 52);
  ctx.textAlign = 'left';
}

// ---------- upgrades ----------
const POOL = [
  { n: 'Sharpened Rounds', d: '+4 damage per shot', base: 10, f: () => p.dmg += 4 },
  { n: 'Hair Trigger', d: '+18% fire rate', base: 12, f: () => p.rate *= 1.18 },
  { n: 'Long Barrel', d: '+45 targeting range', base: 8, f: () => p.range += 45 },
  { n: 'Track Shoes', d: '+22 move speed', base: 9, f: () => p.speed += 22 },
  { n: 'Plating', d: '+18 max HP, heal 18', base: 11, f: () => { p.maxHp += 18; p.hp += 18; } },
  { n: 'Piercing Tips', d: 'Bullets pass through +1 enemy', base: 22, f: () => p.pierce += 1 },
  { n: 'Scrap Magnet', d: '+45 pickup radius', base: 7, f: () => p.pickup += 45 },
  { n: 'Hot Loads', d: '+120 bullet speed', base: 7, f: () => p.bulletSpd += 120 },
  { n: 'Field Rations', d: 'Heal 40% of max HP', base: 8, f: () => p.hp = Math.min(p.maxHp, p.hp + p.maxHp * .4) }
];

function cost(u) {
  const lv = p.lvl[u.n] || 0;
  return Math.round(u.base + lv * u.base * 0.7 + wave * 1.5);
}

function makeOffer() {
  const pick = [...POOL].sort(() => Math.random() - .5).slice(0, 4);
  offer = pick.map(u => ({ u, bought: false }));
}

function renderShop() {
  document.getElementById('shopTitle').textContent = 'Salvage Bench — after wave ' + wave;
  document.getElementById('bank').textContent = scrap + ' scrap';
  document.getElementById('rrCost').textContent = rrCost;
  const box = document.getElementById('cards');
  box.innerHTML = '';
  offer.forEach((o, i) => {
    const c = cost(o.u);
    const el = document.createElement('div');
    el.className = 'card' + (o.bought ? ' bought' : (scrap < c ? ' broke' : ''));
    el.innerHTML = '<div class="n">' + o.u.n + '</div><div class="d">' + o.u.d + '</div><div class="c">' + (o.bought ? 'OWNED' : c + ' scrap') + '</div>';
    el.onclick = () => {
      if (o.bought || scrap < c) return;
      scrap -= c;
      o.u.f();
      p.lvl[o.u.n] = (p.lvl[o.u.n] || 0) + 1;
      o.bought = true;
      renderShop();
    };
    box.appendChild(el);
  });
}

// ---------- flow ----------
function endWave() {
  state = 'shop';
  enemies.length = 0;
  bullets.length = 0;
  for (const d of drops) scrap++;
  drops.length = 0;
  rrCost = 4;
  makeOffer();
  renderShop();
  document.getElementById('shop').classList.add('on');
}

function nextWave() {
  document.getElementById('shop').classList.remove('on');
  wave++;
  waveTime = 20;
  spawnT = 0;
  p.x = W / 2; p.y = H / 2;
  p.inv = 1;
  state = 'play';
}

function die() {
  state = 'dead';
  document.getElementById('deadStats').innerHTML =
    'Reached wave <b style="color:#F5A623">' + wave + '</b><br>' +
    kills + ' enemies destroyed<br>' + scrap + ' scrap unspent';
  document.getElementById('dead').classList.add('on');
}

document.getElementById('next').onclick = nextWave;
document.getElementById('reroll').onclick = () => {
  if (scrap < rrCost) return;
  scrap -= rrCost;
  rrCost += 3;
  makeOffer();
  renderShop();
};
document.getElementById('start').onclick = () => {
  document.getElementById('title').classList.remove('on');
  reset();
};
document.getElementById('restart').onclick = () => {
  document.getElementById('dead').classList.remove('on');
  reset();
};

reset();
state = 'menu';

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
